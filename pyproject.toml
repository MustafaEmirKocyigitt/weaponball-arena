[project]
name = "arena"
version = "0.1.0"
description = "Daily automated football team arena battle videos for Instagram Reels"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.5",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arena = "arena.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
