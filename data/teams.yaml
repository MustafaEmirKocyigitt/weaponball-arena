# Team look overrides. Keys are normalized names (lowercase, no accents).
# Any team not listed falls back to ESPN's colors / abbreviation.
#   short: 3-letter label drawn on the ball
#   primary / secondary: ball colors
#   weapon: sword | spear | hammer | daggers | axe  (optional; otherwise derived from the name)
#   big: true -> counts as a globally popular club when picking the match of the day
#   aliases: other spellings ESPN or users may use

galatasaray:        {name: Galatasaray, short: GAL, primary: "#A90432", secondary: "#FDB912", weapon: sword, big: true}
fenerbahce:         {name: Fenerbahçe, short: FEN, primary: "#FFE01B", secondary: "#0B1E5B", weapon: spear, big: true}
