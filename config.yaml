# Arena configuration. Everything here can be tweaked without touching code.

timezone_offset_hours: 3      # Turkey is UTC+3 all year (no DST)
post_time_local: "19:00"      # when the Reel goes live (local time above)
brand: "@weaponball.fc"       # shown at the bottom of the video and on the winner card

video:
  width: 1080
  height: 1920
  fps: 60
  intro_seconds: 2.0
  post_ko_seconds: 1.2
  outro_seconds: 2.8
  crf: 19
  preset: veryfast

audio:
  sample_rate: 48000
  beat: true                 # procedural 128 BPM music bed under the fight (audio/music.py)
  beat_volume: 0.32
  music_volume: 0.35         # used only if a file exists in assets/music/
  sfx_volume: 1.0

# Leagues to scan every day (ESPN codes). `bonus` = how much a match from
# this league is preferred when picking the match of the day.
leagues:
  - {code: tur.1, name: "SÜPER LIG",      tags: [superlig, turkishfootball],  bonus: 1.5}
  - {code: eng.1, name: "PREMIER LEAGUE", tags: [premierleague, epl],         bonus: 2.0}
  - {code: esp.1, name: "LALIGA",         tags: [laliga],                     bonus: 1.6}
  - {code: ger.1, name: "BUNDESLIGA",     tags: [bundesliga],                 bonus: 1.2}
  - {code: ita.1, name: "SERIE A",        tags: [seriea],                     bonus: 1.2}
  - {code: fra.1, name: "LIGUE 1",        tags: [ligue1],                     bonus: 1.0}
  - {code: uefa.champions, name: "CHAMPIONS LEAGUE", tags: [championsleague, ucl], bonus: 3.0}
  - {code: uefa.europa,    name: "EUROPA LEAGUE",    tags: [europaleague, uel],    bonus: 1.8}
  - {code: uefa.europa.conf, name: "CONFERENCE LEAGUE", tags: [conferenceleague, uecl], bonus: 1.0}

selection:
  big_club_bonus: 4.0          # per big club in the match (see data/teams.yaml `big: true`)
  both_big_bonus: 3.0          # extra when both clubs are big
  rank_weight: 3.0             # rewards matches between teams high in the table
  derby_bonus: 6.0
  after_post_time_bonus: 3.0   # prefer matches that kick off after the post goes live
  # Turkish clubs in European competitions (uefa.*) get an extra push:
  # big Turkish fan base, and those nights trend in Turkey.
  turkish_euro_bonus: 2.5
  turkish_clubs: [galatasaray, fenerbahce, besiktas, trabzonspor, istanbul basaksehir, samsunspor, goztepe, kasimpasa]

derbies:
  - [galatasaray, fenerbahce]
  - [galatasaray, besiktas]
  - [fenerbahce, besiktas]
  - [fenerbahce, trabzonspor]
  - [galatasaray, trabzonspor]
  - [real madrid, barcelona]
  - [atletico madrid, real madrid]
  - [manchester united, manchester city]
  - [liverpool, everton]
  - [liverpool, manchester united]
  - [arsenal, tottenham hotspur]
  - [arsenal, chelsea]
  - [ac milan, internazionale]
  - [juventus, internazionale]
  - [as roma, lazio]
  - [bayern munich, borussia dortmund]
  - [paris saint-germain, marseille]

# Used when no match is found for the day ("LEGENDS CLASH").
legends:
  - [galatasaray, fenerbahce]
  - [real madrid, barcelona]
  - [manchester united, liverpool]
  - [bayern munich, borussia dortmund]
  - [ac milan, internazionale]
  - [galatasaray, real madrid]
  - [fenerbahce, manchester city]
  - [besiktas, juventus]
  - [paris saint-germain, bayern munich]
  - [arsenal, barcelona]

director:
  seeds: 300                 # candidate battles simulated per video
  target_min_seconds: 15
  target_max_seconds: 21
  coin_flip_threshold: 0.06  # if strengths are closer than this, favourite is a coin flip
  power_spread: 0.10         # strongest side gets at most +10% damage

instagram:
  # Unified login + never-expiring system-user token (Meta Business "WeaponballBot")
  api_host: https://graph.facebook.com
  api_version: v23.0
  user_id: "17841449071564126"   # @weaponball.fc Instagram account ID (IG_USER_ID env overrides)
  publish_wait_timeout_minutes: 20
  thumb_offset_ms: 1500   # Reels cover = intro frame with both teams, VS and win chance

# Posting rhythm. The anchor post goes out every day at post_time_local
# (19:00 TR = 16:00 UTC). On big match days up to two extra "bonus battles"
# go out 1-4 h before high-profile kick-offs (workflow runs at 11:00 / 18:15 UTC).
schedule:
  max_posts_per_day: 3
  bonus_min_score: 9.0           # see selection weights: roughly "big club in a big competition", a derby, or big vs big
  bonus_window_minutes: [45, 250]

# Busy European nights (e.g. 9 Champions League games at once): instead of one
# bonus battle, the late slot posts ONE "European night" Reel with several fast
# mini battles. Triggered when >= min_matches European fixtures kick off in the
# late window and none of them were posted yet.
night:
  enabled: true
  min_matches: 4
  battles: 3
  window_minutes: [30, 250]
  intro_seconds: 1.9
  outro_seconds: 3.2
  post_ko_seconds: 0.8
  slowmo_window: 0.3
  ko_hold: 14
  tuning: {damage_scale: 4.0, shrink_start: 1.5, shrink_dur: 2.5}
  director:
    seeds: 160
    target_min_seconds: 4.0
    target_max_seconds: 6.0
    coin_flip_threshold: 0.06
    power_spread: 0.10

max_hashtags: 6
hashtags_general: [football, prediction, satisfying]

# ---------------------------------------------------------------------------
# A/B test: 4 video drafts. The main post rotates through them day by day
# (bonus slots are offset), every post records its draft in data/history.json,
# and `arena report` compares Instagram stats per draft (REPORT.md).
# When a winner is clear, put only that draft in `rotation`.
variants:
  rotation: [classic, coldopen, neon, lava]
  defs:
    classic:                      # A: control group = the current format
      label: "A · Classic"
      video: {thumb_offset_ms: 1500}
    coldopen:                     # B: does the static intro card lose viewers?
      label: "B · Cold open"
      video: {intro_seconds: 0, hook_seconds: 1.8, outro_seconds: 2.4, fight_banner: false, thumb_offset_ms: 700}
      director: {target_min_seconds: 12, target_max_seconds: 16, early_hit_seconds: 1.2}
      tuning: {damage_scale: 2.0, shrink_start: 8.0, shrink_dur: 5.0}
    neon:                         # C: new arena + faster music, shortest
      label: "C · Neon speed"
      video:
        intro_seconds: 0
        hook_seconds: 1.6
        outro_seconds: 2.2
        fight_banner: false
        thumb_offset_ms: 700
        theme: {ring: [255, 70, 230], danger: [255, 236, 70], bg_top: [34, 8, 52], bg_bottom: [6, 2, 16],
                floor_inner: [44, 14, 70], floor_outer: [12, 4, 24], floor_line: [20, 60, 80], pattern: grid}
      audio: {bpm: 140, pitch: 1.12, sfx_volume: 1.1}
      director: {target_min_seconds: 10, target_max_seconds: 14, early_hit_seconds: 1.0}
      tuning: {damage_scale: 2.4, shrink_start: 6.5, shrink_dur: 4.5}
    lava:                         # D: new arena + heavier sound
      label: "D · Lava"
      video:
        intro_seconds: 0
        hook_seconds: 1.8
        outro_seconds: 2.4
        fight_banner: false
        thumb_offset_ms: 700
        theme: {ring: [255, 150, 40], danger: [255, 50, 20], bg_top: [44, 12, 6], bg_bottom: [10, 3, 2],
                floor_inner: [66, 24, 10], floor_outer: [22, 8, 4], floor_line: [130, 46, 10], pattern: cracks}
      audio: {bpm: 118, pitch: 0.84, sfx_volume: 1.15}
      director: {target_min_seconds: 11, target_max_seconds: 15, early_hit_seconds: 1.2}
      tuning: {damage_scale: 2.2, shrink_start: 7.0, shrink_dur: 5.0}
