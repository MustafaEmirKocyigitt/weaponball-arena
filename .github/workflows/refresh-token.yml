name: refresh-instagram-token

# Instagram long-lived tokens expire after 60 days. Refreshing weekly keeps
# it alive forever. Needs a fine-grained PAT (secret GH_PAT) with
# "Secrets: read and write" on this repository.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Refresh and store token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW="$(arena refresh-token)"
          echo "::add-mask::$NEW"
          test -n "$NEW"
          gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
