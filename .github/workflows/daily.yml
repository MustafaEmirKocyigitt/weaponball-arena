name: daily-arena

# Three runs a day (all times UTC):
#   11:00  "early" bonus battle  - only if a high-profile match kicks off ~11:45-15:10
#   15:35  "main"  daily anchor  - always posts, waits until 16:00 UTC (19:00 TR)
#   18:15  "late"  bonus battle  - only if another high-profile match kicks off ~19:00-22:25;
#                                on busy European nights (>= 4 games) a single multi-battle "night" Reel instead
# At most 3 posts a day, never the same match twice (see config.yaml -> schedule).
#
# Primary trigger: cron-job.org calls this workflow on time (see README). The
# GitHub schedules below are only a fallback.
# GitHub sometimes starts scheduled runs late or skips them, so each slot has a
# backup run 25-30 min later. A backup only posts if its slot hasn't posted yet
# (checked against data/history.json), so nothing is ever posted twice.
on:
  schedule:
    - cron: "0 11 * * *"     # early
    - cron: "30 11 * * *"    # early backup
    - cron: "35 15 * * *"    # main
    - cron: "0 16 * * *"     # main backup (posts immediately)
    - cron: "15 18 * * *"    # late
    - cron: "45 18 * * *"    # late backup
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Instagram (immediately)"
        type: boolean
        default: false
      slot:
        description: "Which post to make"
        type: choice
        options: [main, early, late, night]
        default: main
      scheduled:
        description: "Behave like a scheduled run (used by the external cron-job.org trigger)"
        type: boolean
        default: false
      date:
        description: "Local date YYYY-MM-DD (empty = today)"
        type: string
        default: ""

permissions:
  contents: write   # to commit data/history.json

concurrency:
  group: daily-arena
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Publishing is skipped (with a warning) until the Instagram secret exists.
      HAS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN != '' }}
      WANT_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish || inputs.scheduled }}
      SCHED: ${{ github.event.schedule }}
    steps:
      - name: Decide slot
        env:
          INPUT_SLOT: ${{ inputs.slot }}
          INPUT_SCHEDULED: ${{ inputs.scheduled }}
        run: |
          case "$SCHED" in
            "0 11 * * *"|"30 11 * * *") SLOT=early ;;
            "15 18 * * *"|"45 18 * * *") SLOT=late ;;
            "35 15 * * *"|"0 16 * * *") SLOT=main ;;
            *) SLOT="${INPUT_SLOT:-main}" ;;
          esac
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"
          # scheduled runs (incl. backups) never repeat a slot that already posted today
          # external trigger (cron-job.org): punctual, so no delay check, but never repeat a post
          if [ "$INPUT_SCHEDULED" = "true" ]; then echo "ARENA_SKIP_IF_POSTED=1" >> "$GITHUB_ENV"; fi
          if [ -n "$SCHED" ]; then
            echo "ARENA_SKIP_IF_POSTED=1" >> "$GITHUB_ENV"
            # GitHub can start scheduled runs hours late; a stale run must not post at a random time
            M=$(echo "$SCHED" | cut -d' ' -f1); H=$(echo "$SCHED" | cut -d' ' -f2)
            NOW=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M))); WANT=$((H * 60 + M))
            DELAY=$(( (NOW - WANT + 1440) % 1440 ))
            echo "started ${DELAY} min after schedule"
            if [ "$DELAY" -gt 100 ]; then
              echo "::warning::scheduled run started ${DELAY} min late - skipping"
              echo "SKIP=1" >> "$GITHUB_ENV"
            fi
          fi
          echo "slot=$SLOT schedule='$SCHED'"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Pick match + render video
        id: render
        if: env.SKIP != '1'
        env:
          DATE_INPUT: ${{ inputs.date }}
        run: |
          echo "slot: $SLOT"
          if [ -n "$DATE_INPUT" ]; then
            arena daily --github-output --slot "$SLOT" --date "$DATE_INPUT"
          else
            arena daily --github-output --slot "$SLOT"
          fi

      - name: Keep the video as a build artifact
        if: steps.render.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: arena-${{ env.SLOT }}-${{ github.run_id }}
          path: ${{ steps.render.outputs.dir }}
          retention-days: 14

      - name: Instagram not configured yet
        if: steps.render.outputs.dir != '' && env.WANT_PUBLISH == 'true' && env.HAS_TOKEN != 'true'
        run: echo "::warning::IG_ACCESS_TOKEN secret is missing - video rendered but not published."

      - name: Publish to Instagram
        if: steps.render.outputs.dir != '' && env.WANT_PUBLISH == 'true' && env.HAS_TOKEN == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # The anchor post waits for 16:00 UTC; bonus battles and manual runs go out right away.
          NOW_FLAG: ${{ ((github.event_name == 'workflow_dispatch' && !inputs.scheduled) || env.SLOT != 'main') && '--now' || '' }}
        run: arena publish --dir "${{ steps.render.outputs.dir }}" $NOW_FLAG

      # Keep the prediction record (data/history.json) so tomorrow's caption can
      # say whether today's call was right. Also keeps the repo "active".
      - name: Save prediction history
        if: steps.render.outputs.dir != '' && env.WANT_PUBLISH == 'true' && env.HAS_TOKEN == 'true'
        run: |
          git config user.name "weaponball-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "history: $(date -u +%F) $SLOT"
          git pull --rebase --autostash
          git push
